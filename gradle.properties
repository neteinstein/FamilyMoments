org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Kotlin Multiplatform (see AGENTS.md's KMP migration section; same settings as
# neteinstein/loopgain, the reference KMP+CMP app this migration follows).
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.cacheKind=none
org.jetbrains.compose.experimental.uikit.enabled=true

# Obfuscation/shrinking for the `release` build type (app/build.gradle.kts + app/proguard-rules.pro).
# Full mode is AGP's default from 8.0 onwards; pinned explicitly so the release build's shrinking
# behaviour is stated rather than inherited, and so a future AGP default flip is a visible change
# to this file instead of a silent one. Full mode is what makes the aggressive keep-nothing-by-
# default posture in app/proguard-rules.pro effective.
android.enableR8.fullMode=true
