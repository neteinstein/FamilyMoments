name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --console=plain --no-daemon --stacktrace

  # ─── Compile ────────────────────────────────────────────────────────────────
  compile:
    name: Compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional on purpose. A pull request from a fork cannot read repository secrets at all,
          # and this repo is source-available, so PR checks must pass without Firebase config:
          # androidApp applies the google-services plugin only when this file exists, and
          # FirebaseAnalyticsTracker no-ops when FirebaseApp never initialized. Skipping here means
          # the PR build compiles the analytics code without exercising the real SDK wiring - the
          # release workflow, which does require the secret, is what proves that end to end.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON not set - building without Firebase (analytics disabled)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          echo "Wrote androidApp/google-services.json"

      - name: Compile debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  # ─── Minified Release ───────────────────────────────────────────────────────
  # `assembleDebug` above never runs R8, so a broken keep rule in androidApp/proguard-rules.pro is
  # invisible to it and would only surface in .github/workflows/release.yml, after the merge to
  # main. This job builds the same minified/obfuscated/resource-shrunk output the release
  # workflow does (both distribution flavors) and then asserts on R8's mapping file that
  # obfuscation actually happened and that the two names Room resolves reflectively survived it,
  # so a regression in the shrinker config fails the PR instead of the release.
  # No signing secrets are needed: androidApp/build.gradle.kts falls back to debug signing when
  # KEYSTORE_FILE is unset, and shrinking is identical either way.
  minified-release:
    name: Minified Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional on purpose. A pull request from a fork cannot read repository secrets at all,
          # and this repo is source-available, so PR checks must pass without Firebase config:
          # androidApp applies the google-services plugin only when this file exists, and
          # FirebaseAnalyticsTracker no-ops when FirebaseApp never initialized. Skipping here means
          # the PR build compiles the analytics code without exercising the real SDK wiring - the
          # release workflow, which does require the secret, is what proves that end to end.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON not set - building without Firebase (analytics disabled)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          echo "Wrote androidApp/google-services.json"

      - name: Build minified release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify obfuscation
        run: ./scripts/verify-obfuscation.sh

      # The mapping file is the only way to read a stack trace from these builds, and it is also
      # what a reviewer needs to inspect what R8 renamed or removed on this PR.
      - name: Upload R8 mapping files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-files
          path: androidApp/build/outputs/mapping/*Release/
          # Not "error": this step runs with always(), so a build that failed before R8 ran has
          # nothing to upload and should report the build failure, not an artifact one.
          if-no-files-found: warn

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # androidApp (the only classic android-library module left) builds two flavors, so its unit
      # test tasks are flavor-scoped (testGithubDebugUnitTest/testPlaystoreDebugUnitTest) - the
      # plain testDebugUnitTest name is ambiguous once feature:home (the last unflavored module
      # with that literal task) converted to KMP, since Gradle's task-name abbreviation matching
      # then treats it as matching both flavor tasks instead of resolving directly. testAndroidHostTest
      # covers the KMP android-library modules' (core:domain, core:data, core:ui, feature:splash,
      # feature:settings, feature:home, app) JVM host tests. A module without a given task is simply
      # skipped, Gradle only errors if none of these tasks exist anywhere in the build.
      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional on purpose. A pull request from a fork cannot read repository secrets at all,
          # and this repo is source-available, so PR checks must pass without Firebase config:
          # androidApp applies the google-services plugin only when this file exists, and
          # FirebaseAnalyticsTracker no-ops when FirebaseApp never initialized. Skipping here means
          # the PR build compiles the analytics code without exercising the real SDK wiring - the
          # release workflow, which does require the secret, is what proves that end to end.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON not set - building without Firebase (analytics disabled)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          echo "Wrote androidApp/google-services.json"

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest testPlaystoreDebugUnitTest testAndroidHostTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/build/test-results/test*/**.xml'

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/build/test-results/test*/**.xml'
          comment_title: '🧪 Unit Test Results'

  # ─── Web (wasmJs) Compile ───────────────────────────────────────────────────
  # deploy-pages.yml runs this same task on every push to main, but only after the merge - this
  # job catches a broken wasmJs build before that, on the PR itself.
  compile-web:
    name: Compile Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build wasmJs production distribution
        # Read straight from the environment by webApp/build.gradle.kts - no file to write. Unset
        # on fork PRs, which renders an init script that leaves analytics off; the build still
        # succeeds, which is the point of that fallback.
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

  # ─── iOS Compile ────────────────────────────────────────────────────────────
  # Needs a macOS runner for the Kotlin/Native iOS toolchain (Xcode). Runs the unscoped
  # iosSimulatorArm64Test task, which Gradle resolves against every KMP module (core:*, feature:*,
  # app) - this compiles each module's commonMain/iosMain source for the simulator target and runs
  # whatever commonTest suites can execute there. Most ViewModel/repository tests are MockK-based
  # and JVM/Robolectric-only (see AGENTS.md's testing conventions - MockK has no Kotlin/Native
  # support), so this job's main value is compile verification across the whole module graph, not
  # full test coverage on iOS; app's AppScaffoldTest is the one suite written to actually run here.
  compile-ios:
    name: Compile iOS
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test for iOS simulator
        run: ./gradlew iosSimulatorArm64Test --no-daemon --stacktrace

  # ─── Code Coverage ──────────────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # androidApp keeps AGP's own coverage-report task (createGithubDebugUnitTestCoverageReport -
      # pinned to the "github" flavor, since it builds two and the plain "Debug" task name is
      # ambiguous) since it's a classic android-application module. Every core:*/feature:*/app
      # module is a KMP android-library instead, which has no enableUnitTestCoverage equivalent
      # (see AGENTS.md's KMP migration note) - kotlinx-kover covers those, aggregated at the root
      # project via the `kover(project(...))` dependencies in the root build.gradle.kts.
      # testAndroidHostTest runs explicitly (not left to koverXmlReport's own task dependencies)
      # to sidestep a known issue where AGP 9.x can leave Kover's report tasks without a real
      # dependency on the test tasks that generate their input (Kotlin/kotlinx-kover#785).
      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Optional on purpose. A pull request from a fork cannot read repository secrets at all,
          # and this repo is source-available, so PR checks must pass without Firebase config:
          # androidApp applies the google-services plugin only when this file exists, and
          # FirebaseAnalyticsTracker no-ops when FirebaseApp never initialized. Skipping here means
          # the PR build compiles the analytics code without exercising the real SDK wiring - the
          # release workflow, which does require the secret, is what proves that end to end.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON not set - building without Firebase (analytics disabled)."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json
          echo "Wrote androidApp/google-services.json"

      - name: Run tests with coverage
        run: ./gradlew createGithubDebugUnitTestCoverageReport testAndroidHostTest koverXmlReport --no-daemon --stacktrace

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/build/reports/coverage/
            build/reports/kover/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: '**/build/reports/coverage/test/githubDebug/report.xml,build/reports/kover/report.xml'
          fail_ci_if_error: false
          verbose: true
