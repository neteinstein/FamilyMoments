name: Deploy Web (GitHub Pages)

# Deploys webApp's wasmJs production build to GitHub Pages on every push to `kmp` - lets the
# in-progress KMP+CMP migration (see AGENTS.md) be checked in a browser without a local Kotlin/Wasm
# toolchain. TEMPORARY: once the migration lands on `main`, switch the branch trigger below (and
# GitHub Pages' own source branch, if it's pinned rather than driven by this workflow) from `kmp`
# to `main`.

on:
  push:
    branches: [ kmp ]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build wasmJs distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build wasmJs production distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
